name: release-audible

# Builds and publishes the Audible image to this repository's own package
# registry. GITHUB_TOKEN carries packages:write for that namespace, so no
# personal access token or local docker login is needed.
#
# This is fork-specific. Upstream publishes its images manually via the
# release-* Makefile targets.

on:
  push:
    tags:
      - "audible-v*"
  workflow_dispatch:

concurrency:
  group: release-audible-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The moving `audible` tag is what docker-compose-audible.yml pulls. The
      # sha tag is there so a bad release can be rolled back to a specific
      # build rather than rebuilt from a guess.
      - name: Compute tags
        id: tags
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          tags="${image}:audible,${image}:audible-${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags="${tags},${image}:${GITHUB_REF#refs/tags/}"
          fi
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"

      # No QEMU: the Dockerfile's build stage pins $BUILDPLATFORM and passes
      # GOOS/GOARCH, so arm64 is cross-compiled natively rather than emulated.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: RGPATH=./cmd/rgab
          tags: ${{ steps.tags.outputs.tags }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
